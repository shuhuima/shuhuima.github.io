<!--
  ==================================================================
  怎么用这个文件
  ==================================================================
  1) 改文字：只改下面的「文案区」，搜索 ★文案区★ 即可定位。
     所有文字都在引号里，改引号里的字就行，不要碰引号外面的标点。
  2) 换图片：在「文案区」里找 photos: []，
     把图片文件名填进方括号，用英文逗号隔开。例如：
         photos: ["images/works/AI公仔主视觉01.jpg", "images/works/AI公仔主视觉02.jpg"]
     一个位置放 1 张就是静止图；放 2 张以上会自动变成横向滚动轮播。
     图片放进本文件旁边的 images/works/ 文件夹。
  3) 保存后按 Ctrl+S，浏览器里 F5 刷新。
  4) 字体已自动加载：英文 Archivo，中文优先 HarmonyOS Sans，
     退回 Source Han Sans / 系统中文（无需手动配置）。
  ==================================================================
-->

<!-- 字体：纯系统字体栈，不请求 Google Fonts（国内会阻塞渲染数秒）。中文走 PingFang SC / 微软雅黑，英文走系统无衬线 -->

<style>
  /* ---------- 字体堆叠：英文 Archivo，中文 HarmonyOS Sans / 思源黑体 ---------- */
  :root{
    --paper:#FFFFFF;
    --placeholder:#F4F3F0;
    --ink:#2C2C2C;
    --ink-soft:#57574F;
    --ink-faint:#8F8F87;
    --line:rgba(17,17,17,0.14);
    --line-soft:rgba(17,17,17,0.07);
    --brown:#3E2716;
    --brown-deep:#2A1809;
    --cream:#F4EEE5;
    --ease:cubic-bezier(0.22,1,0.36,1);
    --font:
      "Public Sans", "Archivo",
      "HarmonyOS Sans SC", "HarmonyOS Sans",
      "Source Han Sans SC", "Noto Sans SC",
      "PingFang SC",
      -apple-system, BlinkMacSystemFont, "Helvetica Neue",
      "Microsoft YaHei", sans-serif;
  }

  *,*::before,*::after{box-sizing:border-box}
  html{scroll-behavior:smooth;scroll-padding-top:96px;-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font);
    font-weight:400;
    font-feature-settings:"palt" 1;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    text-rendering:optimizeLegibility;
  }
  ::selection{background:var(--brown);color:var(--cream)}
  ::-webkit-scrollbar{width:8px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(17,17,17,.14);border-radius:99px}

  h1,h2,h3,h4,p,dl,dd,dt,figure{margin:0}
  ul{margin:0;padding:0;list-style:none}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

  .shell{max-width:1560px;margin:0 auto;padding:0 20px}
  @media(min-width:768px){.shell{padding:0 40px}}
  @media(min-width:1024px){.shell{padding:0 56px}}

  .link-calm{position:relative;display:inline-block}
  .link-calm::after{
    content:"";position:absolute;left:0;bottom:-2px;width:100%;height:1px;
    background:currentColor;transform:scaleX(0);transform-origin:right;
    transition:transform .7s var(--ease);
  }
  .link-calm:hover::after{transform:scaleX(1);transform-origin:left}

  /* ---------- 顶栏 ---------- */
  .site-header{
    position:fixed;inset-inline:0;top:0;z-index:50;
    background:rgba(255,255,255,0);
    border-bottom:1px solid rgba(17,17,17,0);
    transition:background-color .6s var(--ease),border-color .6s var(--ease),backdrop-filter .6s var(--ease);
  }
  .site-header.is-lifted{
    background:rgba(255,255,255,.88);
    border-bottom-color:rgba(17,17,17,.12);
    backdrop-filter:saturate(140%) blur(14px);
    -webkit-backdrop-filter:saturate(140%) blur(14px);
  }
  .site-header__inner{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
  @media(min-width:768px){.site-header__inner{height:72px}}
  .brand{display:flex;align-items:baseline;gap:14px;flex-shrink:0;min-width:0;white-space:nowrap}
  .brand__name{font-size:14px;font-weight:800;letter-spacing:.04em}
  @media(min-width:768px){.brand__name{font-size:15px}}
  .brand__role{display:none;font-size:11px;letter-spacing:.12em;color:var(--ink-faint);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media(min-width:768px){.brand__role{display:inline}}
  .nav{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:flex-end}
  @media(min-width:768px){.nav{gap:34px;flex-wrap:nowrap}}
  .nav a{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;transition:opacity .4s var(--ease);white-space:nowrap}
  @media(min-width:768px){.nav a{font-size:12px;letter-spacing:.14em}}
  .nav a:hover{opacity:.5}
  .nav a.nav__contact::after{content:"";margin-left:0}
  @media(min-width:768px){.nav a.nav__contact::after{content:"•";margin-left:16px}}

  /* ---------- 渐显 ---------- */
  .reveal{opacity:0;transform:translate3d(0,14px,0);
    transition:opacity 1.1s var(--ease),transform 1.1s var(--ease);
    transition-delay:var(--d,0ms);will-change:opacity,transform}
  .reveal.is-in{opacity:1;transform:none}
  .enter{opacity:0;transform:translate3d(0,18px,0);
    animation:riseIn 1.6s var(--ease) forwards;animation-delay:var(--d,0ms)}
  @keyframes riseIn{to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    .reveal,.enter{opacity:1!important;transform:none!important;animation:none!important;transition:none!important}
  }

  /* ---------- 首屏：通栏流动波纹（动画只在这第一屏） ---------- */
  .hero-stage{
    position:relative;overflow:hidden;background:var(--paper);
    min-height:calc(100svh - 64px);
    display:flex;align-items:stretch;
    padding:72px 0 56px;
  }
  @media(min-width:768px){.hero-stage{min-height:calc(100svh - 76px);padding:96px 0 72px}}
  /* 波纹画布：铺满整个首屏，通栏无边距 */
  .hero-stage > canvas{
    position:absolute;inset:0;width:100%;height:100%;
    display:block;pointer-events:none;z-index:0;
  }
  /* 文字叠在波纹之上 */
  .hero-stage > .shell{position:relative;z-index:2;display:flex;width:100%}
  .hero-frame{
    position:relative;width:100%;
    display:flex;flex-direction:column;justify-content:space-between;gap:40px;
  }
  @media(min-width:768px){.hero-frame{gap:88px}}
  .hero-top,.hero-mid{position:relative;z-index:2}
  /* 移动端：竖排，让 eyebrow 与 sub 各自一行，不被挤扁 */
  .hero-top{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
  @media(min-width:768px){
    .hero-top{flex-direction:row;align-items:baseline;justify-content:space-between;gap:16px 32px;flex-wrap:wrap}
  }
  .hero__eyebrow{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.18em}
  .hero__sub{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--ink-soft)}
  .hero-mid{max-width:34em;margin-top:auto}
  @media(min-width:768px){.hero-mid{margin-top:0}}
  .hero__title{font-size:clamp(2.1rem,9vw,4.9rem);font-weight:600;line-height:1.22;letter-spacing:.01em}
  @media(min-width:768px){.hero__title{font-size:clamp(2.5rem,5.6vw,4.9rem)}}
  .hero__title span{display:block}
  .hero__subEn{margin-top:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-faint);line-height:1.6;max-width:22em}
  @media(min-width:768px){.hero__subEn{font-size:12px;letter-spacing:.16em;line-height:1.5;max-width:none}}
  .hero__body{margin-top:24px;font-size:14px;line-height:2;color:var(--ink-soft);max-width:30em}
  @media(min-width:768px){.hero__body{font-size:15px}}

  /* ---------- 章节头：粗体小标签 + 通栏实线 ---------- */
  .sec-head__eyebrow{display:flex;align-items:center;gap:20px}
  .sec-head__eyebrow::after{content:"";flex:1;height:1px;background:var(--ink)}
  .sec-head__label{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
  .sec-head__row{margin-top:32px}
  @media(min-width:768px){.sec-head__row{margin-top:48px}}
  @media(min-width:1024px){.sec-head__row{display:flex;align-items:flex-end;justify-content:space-between;gap:80px}}
  .sec-head__title{max-width:22em;font-size:clamp(1.75rem,3.4vw,3rem);font-weight:600;line-height:1.35;letter-spacing:.005em}
  .sec-head__title span{display:block}
  .sec-head__aside{margin-top:20px;font-size:12px;font-weight:500;line-height:2;letter-spacing:.06em;color:var(--ink-faint)}
  @media(min-width:1024px){.sec-head__aside{margin-top:0;max-width:24em;flex-shrink:0}}

  section{padding-top:96px;padding-bottom:96px}
  @media(min-width:768px){section{padding-top:144px;padding-bottom:144px}}
  @media(min-width:1024px){section{padding-top:176px;padding-bottom:176px}}

  /* ---------- About ---------- */
  #about{padding-top:160px}
  @media(min-width:768px){#about{padding-top:200px}}
  @media(min-width:1024px){#about{padding-top:240px}}
  /* What I Bring 与上一模块（How I Work）之间拉开 */
  #bring{padding-top:120px}
  @media(min-width:768px){#bring{padding-top:176px}}
  @media(min-width:1024px){#bring{padding-top:224px}}
  /* Contact 与上一模块（What I Bring）之间再拉开一档 */
  #contact{padding-top:144px}
  @media(min-width:768px){#contact{padding-top:200px}}
  @media(min-width:1024px){#contact{padding-top:256px}}
  .about__intro{margin-top:48px;max-width:52em;font-size:17px;line-height:2;font-weight:500;color:var(--ink)}
  @media(min-width:768px){.about__intro{margin-top:64px;font-size:19px}}
  .about__note{margin-top:56px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.18em;color:var(--ink-faint)}
  @media(min-width:768px){.about__note{margin-top:72px}}
  .about__phases{margin-top:48px;display:grid;gap:48px}
  @media(min-width:768px){.about__phases{margin-top:72px;grid-template-columns:repeat(3,1fr);gap:48px}}
  @media(min-width:1024px){.about__phases{gap:64px}}
  .about__phase{padding-top:24px}
  .about__phase-no{font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.1em}
  .about__phase-title{margin-top:28px;font-size:1.625rem;font-weight:600;line-height:1.3;letter-spacing:.005em}
  @media(min-width:768px){.about__phase-title{font-size:1.75rem}}
  .about__phase-en{margin-top:10px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint)}
  .about__phase-body{margin-top:20px;font-size:14px;line-height:2.05;color:var(--ink-soft)}
  .about__closer{margin-top:64px;font-size:16px;line-height:2.05;font-weight:500;color:var(--ink);max-width:54em}
  @media(min-width:768px){.about__closer{margin-top:88px;font-size:17px}}

  /* ---------- 案例：横向卡片（默认折叠） ---------- */
  .works-list{border-top:1px solid var(--line)}
  .case-card{border-bottom:1px solid var(--line)}
  .case-card__head{
    display:grid;
    grid-template-columns:1fr;
    gap:40px;
    padding:48px 0;
    cursor:pointer;
    list-style:none;
    transition:opacity .5s var(--ease);
  }
  @media(min-width:1024px){
    .case-card__head{
      grid-template-columns:1fr 380px;
      gap:72px;
      padding:72px 0;
      align-items:start;
    }
  }
  .case-card__head::-webkit-details-marker{display:none}
  .case-card__head:hover .case-card__main{opacity:.6}

  .case-card__no{
    display:block;
    font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.12em;
  }
  .case-card__title{
    margin-top:20px;
    font-size:clamp(1.625rem,3vw,2.5rem);font-weight:600;line-height:1.3;letter-spacing:.005em;
  }
  .case-card__subtitle{
    margin-top:12px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-faint);
  }
  .case-card__brief{
    margin-top:24px;max-width:42em;
    font-size:15px;line-height:2;color:var(--ink-soft);
  }

  /* 卡片上的关键数据 */
  .case-card__stats{
    margin-top:36px;
    display:grid;grid-template-columns:repeat(2,1fr);gap:24px 32px;
    padding-top:8px;
  }
  @media(min-width:768px){
    .case-card__stats{grid-template-columns:repeat(4,1fr);gap:28px}
  }
  .case-card__stats li{display:flex;flex-direction:column;gap:8px;text-align:center;align-items:center}
  .case-card__metric-v{
    font-size:1.375rem;line-height:1;font-variant-numeric:tabular-nums;
    letter-spacing:-.02em;font-weight:800;
  }
  @media(min-width:768px){.case-card__metric-v{font-size:1.625rem}}
  .case-card__metric-l{font-size:11px;font-weight:500;line-height:1.6;letter-spacing:.08em;color:var(--ink-faint)}

  /* 查看详情 */
  .case-card__cue{
    margin-top:36px;display:inline-flex;align-items:center;gap:10px;
    font-size:12px;font-weight:800;letter-spacing:.1em;
  }
  .case-card__cue-arrow{
    display:inline-flex;align-items:center;justify-content:center;
    transition:transform .5s var(--ease);
  }
  .case-card[open] .case-card__cue-arrow{transform:rotate(90deg)}

  /* 卡片小图 */
  .case-card__thumb{order:-1}
  @media(min-width:1024px){.case-card__thumb{order:0}}
  /* thumbmeta 已移除 */

  /* ---------- 案例展开后内容 ---------- */
  .case-card__body{padding:8px 0 56px}
  @media(min-width:1024px){.case-card__body{padding:16px 0 88px;padding-left:96px}}
  .case-card__intro{font-size:18px;line-height:1.9;font-weight:400;color:var(--ink)}
  @media(min-width:768px){.case-card__intro{font-size:22px;line-height:1.85}}
  .case-card__introMeta{margin-top:14px;font-size:12px;font-weight:600;letter-spacing:.1em;color:var(--ink-faint)}
  .case-card__lead{margin-top:32px;font-size:15px;line-height:2.05;color:var(--ink-soft);max-width:56em}
  @media(min-width:768px){.case-card__lead{font-size:16px;margin-top:40px}}
  .case-card__closer{margin-top:36px;font-size:16px;line-height:1.9;color:var(--ink);max-width:56em;font-weight:400}
  @media(min-width:768px){.case-card__closer{margin-top:48px}}

  /* ---------- 案例内的子分区段（01 / 02 / 03 / 04） ---------- */
  .sub{margin-top:48px}
  @media(min-width:768px){.sub{margin-top:72px}}
  @media(min-width:1024px){.sub{margin-top:56px}}
  /* 内容稀疏的小节（如 Case 04，每段只有一行字）自动收紧，
     否则大间距会把短文字撑成大片空白。字数由渲染时判断后加类。 */
  .sub--tight{margin-top:28px}
  @media(min-width:768px){.sub--tight{margin-top:40px}}
  @media(min-width:1024px){.sub--tight{margin-top:36px}}
  .sub__head{
    display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;
    padding-top:20px;
  }
  .sub--tight .sub__head{padding-top:14px}
  .sub--tight .sub__body{margin-top:14px;gap:14px}
  @media(min-width:768px){.sub--tight .sub__body{margin-top:18px;gap:18px}}
  .sub--tight .sub__text{gap:14px}
  .sub__no{font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.1em}
  .sub__title{font-size:1.375rem;font-weight:600;line-height:1.35;letter-spacing:.005em}
  @media(min-width:768px){.sub__title{font-size:1.5rem}}
  .sub__subEn{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin-left:auto}
  .sub__body{margin-top:24px;display:flex;flex-direction:column;gap:24px;max-width:64em}
  @media(min-width:768px){.sub__body{margin-top:32px;gap:28px}}
  @media(min-width:1024px){
    .sub__body--with-img{display:grid;grid-template-columns:5fr 2fr;column-gap:56px;row-gap:32px;align-items:start}
  }
  .sub__text{display:flex;flex-direction:column;gap:20px}
  @media(min-width:768px){.sub__text{gap:24px}}
  .sub__body p{font-size:15px;line-height:2.05;color:var(--ink-soft)}
  .sub__bullets{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
  .sub__bullets li{
    border:1px solid var(--line);padding:8px 16px;
    font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--ink-soft);
  }
  .sub__emphasis{margin-top:12px;display:flex;flex-direction:column;gap:12px}
  .sub__emphasis p{
    font-size:17px;line-height:1.8;color:var(--ink);font-weight:800;letter-spacing:.01em;
  }
  @media(min-width:768px){.sub__emphasis p{font-size:19px}}
  .sub__fig{display:flex;flex-direction:column;gap:16px}
  @media(min-width:768px){.sub__fig{gap:20px}}
  /* 按原图比例等比缩放，不裁剪、不拉伸、不留白边 */
  .sub__fig img{width:100%;height:auto;display:block;background:var(--placeholder)}
  /* 桌面端给图片一个尺寸上限，避免竖图过高、与文字块高度失衡 */
  @media(min-width:1024px){
    .sub__fig img{max-width:300px}
    /* 单图微调：通过数据 fit 字段覆盖默认尺寸 */
    .sub__fig img.img-fit-small{max-width:200px}
    .sub__fig img.img-fit-large{max-width:380px}
    /* 稀疏小节里的图同步缩小：一行文字配 300px 大图会留出大量空白 */
    .sub--tight .sub__fig img{max-width:190px}
    .sub--tight .sub__body--with-img{column-gap:40px}
  }

  /* ---------- 案例视觉（图片轮播） ---------- */
  /* ---------- 展开后：关键数据 ---------- */
  .key-numbers{margin-top:56px;padding-top:24px}
  @media(min-width:768px){.key-numbers{margin-top:72px}}
  .key-numbers__title{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
  .key-numbers__grid{margin-top:32px;display:grid;gap:32px}
  @media(min-width:768px){.key-numbers__grid{grid-template-columns:repeat(5,1fr);gap:32px}}
  .key-numbers__item{padding-top:20px}
  @media(min-width:768px){.key-numbers__item{padding-top:0}}
  .key-numbers__v{font-size:1.75rem;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;font-weight:800}
  @media(min-width:768px){.key-numbers__v{font-size:2rem}}
  .key-numbers__l{margin-top:10px;font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--ink-faint)}

  /* ---------- 图片框 / 占位块 ---------- */
  .frame{position:relative;width:100%;overflow:hidden;background:var(--placeholder)}
  .frame-16x9{aspect-ratio:16/9}
  .frame-3x2{aspect-ratio:3/2}
  .frame-4x3{aspect-ratio:4/3}
  .frame-1x1{aspect-ratio:1/1}
  .frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .ph__inner{position:absolute;inset:12px;border:1px solid rgba(17,17,17,.1);pointer-events:none}
  @media(min-width:768px){.ph__inner{inset:20px}}
  .ph__body{position:relative;padding:0 32px;text-align:center;max-width:36em}
  .ph__slot{display:block;font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.18em;text-transform:uppercase}
  .ph__hint{display:block;margin-top:14px;font-size:13px;line-height:1.9;color:var(--ink-soft)}
  @media(min-width:768px){.ph__hint{font-size:14px}}
  .ph__meta{display:block;margin-top:18px;font-size:10px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:.14em;color:var(--ink-faint)}

  /* ---------- 滚动图片（轮播） ---------- */
  .roll__viewport{
    overflow-x:auto;overflow-y:hidden;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;

<script>
(function () {
  "use strict";

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function d(ms) { return ' style="--d:' + ms + 'ms"'; }

  var RATIO_CLASS = { "16/9": "frame-16x9", "3/2": "frame-3x2", "4/3": "frame-4x3", "1/1": "frame-1x1" };
  var RATIO_LABEL = { "16/9": "16 : 9", "3/2": "3 : 2", "4/3": "4 : 3", "1/1": "1 : 1" };
  var RATIO_SIZE  = { "16/9": "2400 × 1350", "3/2": "1800 × 1200", "4/3": "1600 × 1200", "1/1": "1600 × 1600" };

  /* ---------- 单张图 / 占位块 ---------- */
  function slideHTML(ratio, src, alt, slotNo, hint, total, idx) {
    var inner;
    if (src) {
      inner = '<img src="' + esc(src) + '" alt="' + esc(alt || "") + '" draggable="false" loading="lazy" data-fallback="1">';
    } else {
      inner =
        '<div class="ph">' +
          '<span class="ph__inner"></span>' +
          '<span class="ph__body">' +
            '<span class="ph__slot">' + esc(slotNo) + (total > 1 ? " · " + (idx + 1) + "/" + total : "") + '</span>' +
            '<span class="ph__hint">' + esc(hint) + '</span>' +
            '<span class="ph__meta">' + esc(RATIO_LABEL[ratio]) + " · " + esc(RATIO_SIZE[ratio]) + '</span>' +
          '</span>' +
        '</div>';
    }
    return '<div class="roll__item"><div class="frame ' + esc(RATIO_CLASS[ratio]) + '">' + inner + '</div></div>';
  }

  /* ---------- 轮播 / 单图 ---------- */
  function rollerHTML(slot) {
    var ratio = slot.ratio || "16/9";
    var photos = slot.photos || [];
    var list = photos.length ? photos : [null, null, null];
    var slides = list.map(function (p, i) {
      var src = typeof p === "string" ? p : (p && p.src);
      return slideHTML(ratio, src, slot.caption, slot.slot, slot.hint || "此处放置图片", list.length, i);
    }).join("");

    var nav = photos.length > 1
      ? '<span class="roll__nav">' +
          '<button class="roll__btn" type="button" data-dir="-1" aria-label="上一张">&#8592;</button>' +
          '<span class="roll__count">01 / ' + (photos.length < 10 ? "0" : "") + photos.length + '</span>' +
          '<button class="roll__btn" type="button" data-dir="1" aria-label="下一张">&#8594;</button>' +
        '</span>' : "";

    var tip = photos.length ? "" :
      '<div class="roll__hint">还没有放图片 · 在上方「文案区」的 photos: [] 里填文件名即可；填 2 张以上这里会变成可滚动的轮播</div>';

    return '<figure class="roll' + (photos.length > 1 ? "" : " roll--single") + '">' +
      '<div class="roll__viewport"><div class="roll__track">' + slides + '</div></div>' +
      '<figcaption class="roll__caption">' +
        '<span class="cap-no">' + esc(slot.slot) + '</span>' +
        '<span class="cap-text">' + esc(slot.caption) + '</span>' +
        nav +
      '</figcaption>' + tip +
    '</figure>';
  }

  /* ---------- 顶部 ---------- */
  function headerHTML() {
    return '<header class="site-header" id="siteHeader"><div class="shell site-header__inner">' +
      '<a href="#top" class="brand">' +
        '<span class="brand__name">' + esc(SITE.name) + '</span>' +
        '<span class="brand__role">' + esc(SITE.hero.tagline) + '</span>' +
      '</a>' +
      '<nav class="nav" aria-label="主导航">' +
        '<a href="#about">About</a>' +
        '<a href="#works">Works</a>' +
        '<a href="#how">How</a>' +
        '<a href="#bring">Bring</a>' +
        '<a href="#contact" class="nav__contact">Contact</a>' +
      '</nav>' +
    '</div></header>';
  }

  /* ---------- 首屏 ---------- */
  function heroHTML() {
    var h = SITE.hero;
    var titleLines = h.headline.map(function (l, i) {
      return '<span class="enter"' + d(120 + i * 180) + '>' + esc(l) + '</span>';
    }).join("");

    return '<section class="hero-stage" id="top">' +
        '<canvas id="heroWaves" aria-hidden="true"></canvas>' +
        '<div class="shell"><div class="hero-frame">' +
          '<div class="hero-top">' +
            '<p class="hero__eyebrow enter"' + d(60) + '>' + esc(h.eyebrow) + '</p>' +
            '<p class="hero__sub enter"' + d(300) + '>' + esc(h.sub) + '</p>' +
          '</div>' +
          '<div class="hero-mid">' +
            '<h1 class="hero__title">' + titleLines + '</h1>' +
            '<p class="hero__subEn enter"' + d(540) + '>' + esc(h.headlineEn) + '</p>' +

  /* ---------- About ---------- */
  function aboutHTML() {
    var a = SITE.about;
    var titleLines = a.heading.map(function (l, i) {
      return '<span class="reveal"' + d(120 + i * 160) + '>' + esc(l) + '</span>';
    }).join("");
    var phaseItems = a.phases.map(function (p, i) {
      return '<div class="about__phase reveal"' + d(i * 180) + '>' +
        '<div class="about__phase-no">' + esc(p.no) + '.</div>' +
        '<h3 class="about__phase-title">' + esc(p.title) + '</h3>' +
        '<p class="about__phase-en">' + esc(p.titleEn) + '</p>' +
        '<p class="about__phase-body">' + esc(p.body) + '</p>' +
      '</div>';
    }).join("");

    return '<section id="about" class="shell">' +
      '<div class="sec-head">' +

          '<p class="sec-head__aside reveal"' + d(420) + '>' + esc(a.headingEn) + '</p>' +

      '</div>' +
      '<p class="about__intro reveal">' + esc(a.intro) + '</p>' +

      '<p class="about__closer reveal">' + esc(a.closer) + '</p>' +
    '</section>';
  }

  /* ---------- 纯 CSS 数据图表 ---------- */
  function chartHTML(cfg) {
    if (!cfg) return "";
    if (cfg.type === "bars-2") {
      var rows = cfg.rows.map(function (r) {
        return '<div class="chart-A__row">' +
          '<span class="chart-A__label">' + esc(r.label) + '</span>' +
          '<span class="chart-A__bar-wrap">' +
            '<span class="chart-A__bar" style="width:' + r.pct + '%;background:' + esc(r.fill) + '"></span>' +
            '<span class="chart-A__val"' + (r.bold ? ' style="font-weight:700;color:var(--ink)"' : '') + '>' +
              esc(r.value) +
              (r.delta ? ' <span class="chart-A__delta">' + esc(r.delta) + '</span>' : '') +
            '</span>' +
          '</span>' +
        '</div>';
      }).join("");
      return '<div class="chart chart-A">' +
        '<p class="chart__title">' + esc(cfg.title) + '</p>' +
        rows +
      '</div>';
    }
    if (cfg.type === "funnel-2") {
      var rows = cfg.rows.map(function (r) {
        var barCls = 'chart-B__bar chart-B__bar--' + esc(r.kind);
        var bar = '<span class="' + barCls + '" style="width:' + r.pct + '%;background:' + esc(r.fill) + '">' +
          (r.inside ? esc(r.label) : '') + '</span>';
        return '<div class="chart-B__row">' + bar +
          (r.inside ? '' : '<span class="chart-B__val">' + esc(r.label) + '</span>') +
        '</div>';
      }).join("");
      return '<div class="chart chart-B">' +
        '<p class="chart__title">' + esc(cfg.title) + '</p>' +
        rows +
        (cfg.caption ? '<p class="chart-B__caption">' + esc(cfg.caption) + '</p>' : '') +
      '</div>';
    }
    return "";
  }

  /* ---------- 案例：横向卡片（默认折叠） ---------- */
  function caseCardHTML(w, i) {
    /* ===== 卡片默认状态：编号 + 标题 + 一句话描述 + 关键数据 + 一张图 + 查看详情 ===== */
    var stats = (w.metrics || []).map(function (m) {
      return '<li><span class="case-card__metric-v">' + esc(m.value) + '</span>' +
             '<span class="case-card__metric-l">' + esc(m.label) + '</span></li>';
    }).join("");

    var summary =
      '<summary class="case-card__head">' +
        '<div class="case-card__main">' +
          '<span class="case-card__no">' + esc(w.no) + '.</span>' +
          '<h3 class="case-card__title">' + esc(w.title) + '</h3>' +
          '<p class="case-card__subtitle">' + esc(w.subtitle) + '</p>' +
          '<p class="case-card__brief">' + esc(w.brief) + '</p>' +
          '<ul class="case-card__stats">' + stats + '</ul>' +
          '<span class="case-card__cue">查看详情 <span class="case-card__cue-arrow">&#8594;</span></span>' +
        '</div>' +
        '<div class="case-card__thumb">' +
          (w.cardImage ? rollerHTML(w.cardImage) : '') +
        '</div>' +
      '</summary>';

    /* ===== 点击后展开的完整详细内容 ===== */
    var body =
      '<div class="case-card__body">' +
        '<div class="case-card__intro">' + esc(w.intro) + '</div>' +
        (w.introMeta ? '<p class="case-card__introMeta">' + esc(w.introMeta) + '</p>' : '') +
        (w.lead ? '<p class="case-card__lead">' + esc(w.lead) + '</p>' : '') +
        sectionsHTML(w.sections) +
        closerHTML(w.closer) +
        (w.chart ? chartHTML(w.chart) : '') +
        keyNumbersHTML(w.keyNumbers) +
      '</div>';

    return '<details class="case-card reveal"' + d(i * 120) + '>' + summary + body + '</details>';
  }

  function sectionsHTML(sections) {
    return sections.map(function (s, i) {
      var body = (s.paragraphs || []).map(function (p) { return '<p>' + esc(p) + '</p>'; }).join("");
      var bullets = (s.bullets || []).length
        ? '<ul class="sub__bullets">' + s.bullets.map(function (b) { return '<li>' + esc(b) + '</li>'; }).join("") + '</ul>'
        : "";
      var emphasis = (s.emphasis || []).length
        ? '<div class="sub__emphasis">' + s.emphasis.map(function (e) { return '<p>' + esc(e) + '</p>'; }).join("") + '</div>'
        : "";
      var hasImg = !!(s.images && s.images.length);
      // 内容密度自适应：文字很少的小节（比如 Case 04 每段只有一行）
      // 如果沿用大间距，会出现大片空白。这里按字数判断是否收紧。
      var textLen = (s.paragraphs || []).join('').length
        + (s.bullets || []).join('').length
        + (s.emphasis || []).join('').length;
      var tight = textLen > 0 && textLen < 50;
      var imgs = hasImg
        ? '<div class="sub__fig">' + s.images.map(function (item) {
            // 兼容字符串或 { src, fit } 两种形式
            var src = typeof item === "string" ? item : item.src;
            var fit = (item && typeof item === "object" && item.fit) ? String(item.fit) : "";
            var cls = fit ? ' class="img-fit-' + esc(fit) + '"' : "";
            return '<img src="' + esc(src) + '" alt="" loading="lazy" decoding="async"' + cls + '>';
          }).join("") + '</div>'
        : "";
      return '<div class="sub reveal' + (tight ? ' sub--tight' : '') + '"' + d(i * 100) + '>' +
        '<div class="sub__head">' +
          '<span class="sub__no">' + esc(s.no) + '｜</span>' +
          '<h4 class="sub__title">' + esc(s.title) + '</h4>' +
          '<span class="sub__subEn">' + esc(s.subtitle) + '</span>' +
        '</div>' +
        '<div class="sub__body' + (hasImg ? ' sub__body--with-img' : '') + '">' +
          '<div class="sub__text">' + body + bullets + emphasis + (s.extra ? chartHTML(s.extra) : '') + '</div>' +
          imgs +
        '</div>' +
      '</div>';
    }).join("");
  }

  function closerHTML(c) {
    return c ? '<p class="case-card__closer reveal">' + esc(c) + '</p>' : "";
  }

  function keyNumbersHTML(m) {

      '</div></div>';
  }

  function worksHTML() {

  /* ---------- How I Work ---------- */
  function howHTML() {
    var h = SITE.howIWork;
    var titleLines = h.heading.map(function (l, i) {

        '<p class="how__detail">' + esc(it.detail) + '</p>' +
      '</div>';
    }).join("");
    return '<section id="how" class="shell">' +
      '<div class="sec-head">' +
        '<p class="sec-head__eyebrow reveal"><span class="sec-head__label">' + esc(h.eyebrow) + '</span></p>' +
        '<div class="sec-head__row">' +
          '<h2 class="sec-head__title">' + titleLines + '</h2>' +
          '<p class="sec-head__aside reveal"' + d(420) + '>' + esc(h.headingEn) + '</p>' +
        '</div>' +
      '</div>' +
      '<div class="how__grid">' + items + '</div>' +
    '</section>';
  }

  /* ---------- What I Bring ---------- */
  function bringHTML() {
    var b = SITE.bring;
    var titleLines = b.heading.map(function (l, i) {
      return '<span class="reveal"' + d(120 + i * 160) + '>' + esc(l) + '</span>';
    }).join("");
    var items = b.items.map(function (it, i) {
      return '<div class="bring__item reveal"' + d(i * 120) + '>' +
        '<span class="bring__no">0' + (i + 1) + '.</span>' +
        '<h3 class="bring__title">' + esc(it.title) + '</h3>' +
        '<p class="bring__body">' + esc(it.body) + '</p>' +
      '</div>';
    }).join("");
    return '<section id="bring" class="shell">' +
      '<div class="sec-head">' +
        '<p class="sec-head__eyebrow reveal"><span class="sec-head__label">' + esc(b.eyebrow) + '</span></p>' +
        '<div class="sec-head__row">' +
          '<h2 class="sec-head__title">' + titleLines + '</h2>' +
        '</div>' +
      '</div>' +
      '<div class="bring__grid">' + items + '</div>' +
    '</section>';
  }

  /* ---------- Contact ---------- */
  function contactHTML() {
    var c = SITE.contact;
    var titleLines = c.heading.map(function (l, i) {
      return '<span class="reveal"' + d(120 + i * 160) + '>' + esc(l) + '</span>';
    }).join("");
    return '<section id="contact" class="shell contact">' +
      '<div class="sec-head">' +
        '<p class="sec-head__eyebrow reveal"><span class="sec-head__label">' + esc(c.eyebrow) + '</span></p>' +
        '<div class="sec-head__row"><h2 class="sec-head__title">' + titleLines + '</h2></div>' +
      '</div>' +
      '<p class="contact__body reveal">' + esc(c.body) + '</p>' +
      '<div class="contact__channels reveal"' + d(180) + '>' +
        '<a href="mailto:' + esc(SITE.email) + '" class="contact__mail link-calm">' + esc(SITE.email) + '</a>' +
        '<a href="tel:' + esc(SITE.phone) + '" class="contact__phone link-calm">' + esc(SITE.phone) + '</a>' +
      '</div>' +
      '<div class="contact__foot reveal"' + d(320) + '>' +
        '<span>' + esc(SITE.name) + '</span>' +
        '<span>' + esc(SITE.location) + '</span>' +
      '</div>' +
    '</section>';
  }

  /* ---------- 渲染 ---------- */
  document.title = SITE.name + " — 用户洞察 × 产品企划 × AI 产品 × PMM";
  document.body.innerHTML =
    headerHTML() +
    "<main>" + heroHTML() + aboutHTML() + worksHTML() + howHTML() + bringHTML() + contactHTML() + "</main>";

  /* ---------- 图片加载失败 → 回退占位 ---------- */
  Array.prototype.forEach.call(document.querySelectorAll("img[data-fallback]"), function (img) {
    img.addEventListener("error", function () {
      var frame = img.parentNode;
      if (!frame) return;
      frame.innerHTML =
        '<div class="ph"><span class="ph__inner"></span><span class="ph__body">' +
        '<span class="ph__hint">图片没能加载：' + esc(img.getAttribute("src")) + '</span>' +
        '<span class="ph__meta">请检查文件名和路径</span></span></div>';
    });
    if (img.complete && img.naturalWidth === 0) img.dispatchEvent(new Event("error"));
  });

  /* ---------- 轮播：循环翻页 + 计数 + 拖拽 + 自动播放 ---------- */
  Array.prototype.forEach.call(document.querySelectorAll(".roll__viewport"), function (vp) {
    var track = vp.querySelector(".roll__track");
    var countEl = vp.parentNode.querySelector(".roll__count");
    var prevBtn = vp.parentNode.querySelector('[data-dir="-1"]');
    var nextBtn = vp.parentNode.querySelector('[data-dir="1"]');
    var items = track ? Array.prototype.slice.call(track.children) : [];
    if (!items.length) return;

    // 用相对视口的位置计算，避免 offsetLeft（相对定位祖先）与 scrollLeft 坐标系不一致
    function itemLeft(it) {
      return it.getBoundingClientRect().left - vp.getBoundingClientRect().left + vp.scrollLeft;
    }
    function currentIndex() {
      var best = 0, bestD = Infinity;
      items.forEach(function (it, i) {
        var dd = Math.abs(itemLeft(it) - vp.scrollLeft);
        if (dd < bestD) { bestD = dd; best = i; }
      });
      return best;
    }
    function sync() {
      var i = currentIndex();
      if (countEl) {
        var n = String(i + 1); if (n.length < 2) n = "0" + n;
        var t = String(items.length); if (t.length < 2) t = "0" + t;
        countEl.textContent = n + " / " + t;
      }
      // 循环：永远不禁用按钮
    }
    // 循环滚动：最后一张 → 第一张；第一张 ← 最后一张
    function go(dir) {
      if (!items.length) return;
      var i = (currentIndex() + dir + items.length) % items.length;
      if (items[i]) vp.scrollTo({ left: itemLeft(items[i]), behavior: "smooth" });
    }
    if (prevBtn) prevBtn.addEventListener("click", function () { go(-1); userPause(); });
    if (nextBtn) nextBtn.addEventListener("click", function () { go(1); userPause(); });
    vp.addEventListener("scroll", sync, { passive: true });

    var down = false, startX = 0, startScroll = 0, moved = 0, pid = null;
    vp.addEventListener("pointerdown", function (e) {
      userPause();
      // 触摸 / 触控笔交给浏览器原生滚动（overflow-x + scroll-snap 已自带惯性吸附）
      // 只有鼠标才走下面的自定义拖拽，避免和原生滚动打架
      if (e.pointerType && e.pointerType !== "mouse") return;
      if (e.button != null && e.button !== 0) return;
      down = true; moved = 0; startX = e.clientX; startScroll = vp.scrollLeft; pid = e.pointerId;
      // 捕获指针：拖到视口外仍持续收到 pointermove，不会中途断掉
      try { vp.setPointerCapture(pid); } catch (err) {}
    });
    vp.addEventListener("pointermove", function (e) {
      if (!down) return;
      var dx = e.clientX - startX;
      if (Math.abs(dx) > 4) { vp.classList.add("is-dragging"); moved = Math.abs(dx); }
      vp.scrollLeft = startScroll - dx;
      e.preventDefault();
    });
    function endDrag() {
      if (!down) return;
      down = false;
      if (pid != null) { try { vp.releasePointerCapture(pid); } catch (err) {} pid = null; }
      vp.classList.remove("is-dragging");
      var snap = items[currentIndex()];
      if (moved > 4 && snap) vp.scrollTo({ left: itemLeft(snap), behavior: "smooth" });
    }
    vp.addEventListener("pointerup", endDrag);
    vp.addEventListener("pointercancel", endDrag);
    document.addEventListener("pointerup", endDrag);   // 兜底：指针在视口外抬起

    var rollEl = vp.closest(".roll");
    if (rollEl) {
      // 图区整体不触发 case 展开/收起（它在 <summary> 内部，默认点击会误触）
      // 冒泡阶段拦下：先让按钮自己的 handler 跑完，再 preventDefault 取消 summary 的默认行为
      rollEl.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
      });
    }

    sync();
    window.addEventListener("resize", sync);

    /* ---------- 自动循环轮播 ----------
       规则：
       - AUTO_MS（4s）自动切下一张
       - 用户点按钮/拖动后暂停 PAUSE_MS（6s）再继续
       - case 卡片展开（details.open）时停
       - 滚出视口时停
       - prefers-reduced-motion 不播
    */
    var prefersReduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    var AUTO_MS = 4000;
    var PAUSE_MS = 6000;
    var autoT = null, userPauseUntil = 0;

    function startAuto() {
      if (prefersReduce || autoT) return;
      autoT = setInterval(function () {
        if (Date.now() < userPauseUntil) return;
        var card = vp.closest('details');
        if (card && card.open) return;
        go(1);
      }, AUTO_MS);
    }
    function stopAuto() {
      if (autoT) { clearInterval(autoT); autoT = null; }
    }
    function userPause() {
      userPauseUntil = Date.now() + PAUSE_MS;
    }
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (entries) {
        if (entries[0].isIntersecting) startAuto(); else stopAuto();
      }, { threshold: 0.3 }).observe(vp);
    } else {
      startAuto();
    }
    // case 卡片展开/收起时切换
    var cardEl = vp.closest('details');
    if (cardEl) cardEl.addEventListener('toggle', function () {
      if (cardEl.open) stopAuto(); else startAuto();
    });
  });

  /* ---------- 顶栏：滚动后浮出发丝线 ---------- */
  (function () {
    var header = document.getElementById("siteHeader");
    function onScroll() { header.classList.toggle("is-lifted", window.scrollY > 8); }
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
  })();

  /* ---------- 滚动渐显 ---------- */
  (function () {
    var items = document.querySelectorAll(".reveal");
    if (!("IntersectionObserver" in window)) {
      Array.prototype.forEach.call(items, function (el) { el.classList.add("is-in"); });
      return;
    }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) { entry.target.classList.add("is-in"); io.unobserve(entry.target); }
      });
    }, { threshold: 0.12, rootMargin: "0px 0px -8% 0px" });
    Array.prototype.forEach.call(items, function (el) { io.observe(el); });
  })();
})();
</script>

<script>
/* ==================================================================
   首屏流动波纹 —— 复刻 mud.co.jp
   ================================================================== */
(function () {
  var c = document.getElementById('heroWaves');
  if (!c) return;
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var ctx = c.getContext('2d');
  var W = 0, H = 0, dpr = 1;
  var time = 0, lastFrame = performance.now(), cycleT = 0, yawAcc = 0;
  var rings = [];
  var resizeT;

  var CFG = {
    ringCount: 18, segments: 72, fov: 45,
    framing: 1.35, lineWidth: 0.9, alpha: 0.5,
    lifeBase: 11, hold: 13, fade: 6
  };
  var INK = '44,44,44';   // #2C2C2C，与全站主色一致

  var SCENES = [
    { projection:'ortho', shapeSphere:0, hornPower:2,    cameraPitch:0,    cameraYaw:0,   cameraDist:3.33, targetX:0,   targetY:0,   noiseAmp:.092, noiseFreq:1.48, octaves:.7,  spin:.16,  flow:.21, fadeIn:.24, fadeOut:.90,  ampFalloff:2 },
    { projection:'ortho', shapeSphere:0, hornPower:2,    cameraPitch:0,    cameraYaw:0,   cameraDist:1.10, targetX:.5,  targetY:.4,  noiseAmp:.136, noiseFreq:3.64, octaves:1.3, spin:.07,  flow:.27, fadeIn:.14, fadeOut:.875, ampFalloff:1.5 },
    { projection:'persp', shapeSphere:1, hornPower:0,    cameraPitch:0,    cameraYaw:-48, cameraDist:3.95, targetX:.4,  targetY:.4,  noiseAmp:.03,  noiseFreq:1.62, octaves:1.5, spin:.15,  flow:.01, fadeIn:.17, fadeOut:.525, ampFalloff:0 },
    { projection:'ortho', shapeSphere:0, hornPower:1.78, cameraPitch:37.6, cameraYaw:0,   cameraDist:2.71, targetX:0,   targetY:0,   noiseAmp:0,    noiseFreq:.20,  octaves:.5,  spin:.115, flow:.21, fadeIn:.10, fadeOut:.895, ampFalloff:0 },
    { projection:'persp', shapeSphere:0, hornPower:.15,  cameraPitch:89,   cameraYaw:3,   cameraDist:2.85, targetX:0,   targetY:0,   noiseAmp:.018, noiseFreq:4.5,  octaves:1.7, spin:.075, flow:.21, fadeIn:.15, fadeOut:.71,  ampFalloff:0 },
    { projection:'persp', shapeSphere:0, hornPower:.16,  cameraPitch:0,    cameraYaw:0,   cameraDist:3.32, targetX:0,   targetY:0,   noiseAmp:.05,  noiseFreq:3.06, octaves:1.65,spin:0,    flow:.21, fadeIn:.13, fadeOut:.71,  ampFalloff:0 }
  ];

  function fract(x){ return x - Math.floor(x); }
  function clamp01(x){ return x < 0 ? 0 : x > 1 ? 1 : x; }
  function hash21(x, y){
    var px = fract(x*234.34), py = fract(y*435.345);
    var d = px*(px+34.23) + py*(py+34.23);
    px += d; py += d;
    return fract(px*py);
  }
  function vnoise(x, y){
    var ix = Math.floor(x), iy = Math.floor(y);
    var fx = x-ix, fy = y-iy;
    var a = hash21(ix,iy), b = hash21(ix+1,iy), cc = hash21(ix,iy+1), dd = hash21(ix+1,iy+1);
    var ux = fx*fx*(3-2*fx), uy = fy*fy*(3-2*fy);
    return (a+(b-a)*ux) + (cc-a)*uy*(1-ux) + (dd-b)*ux*uy;
  }
  function fbm(x, y, oct){
    var v=0, amp=0.5, fq=1, tot=0, rem = clamp01(oct)*5;
    for (var i=0;i<5;i++){
      var w = clamp01(rem);
      v += w*amp*vnoise(x*fq, y*fq);
      tot += w*amp;
      rem -= 1; amp *= 0.55; fq *= 2.05;
    }
    return tot > 1e-4 ? v/tot : 0;
  }
  function smoothstep(e0, e1, x){
    if (e1 <= e0) return x < e0 ? 0 : 1;
    var t = clamp01((x-e0)/(e1-e0));
    return t*t*(3-2*t);
  }

  function buildRings(){
    rings = [];
    for (var i=0;i<CFG.ringCount;i++){
      var r1 = Math.random(), r2 = Math.random();
      rings.push({
        phase: i / CFG.ringCount,
        vel: (1/CFG.lifeBase) * (0.78 + r1*0.5),
        spin: -1.4 + 1.2*r2,
        seed: (i+1)/CFG.ringCount,
        ang: Math.random()*Math.PI*2
      });
    }
  }

  function lerpScene(a, b, t){
    var o = { projection: t < 0.5 ? a.projection : b.projection };
    for (var k in a) if (typeof a[k] === 'number') o[k] = a[k] + (b[k]-a[k])*t;
    return o;
  }
  function currentScene(){
    var total = CFG.hold + CFG.fade;
    var idx = Math.floor(cycleT / total);
    var from = ((idx % SCENES.length) + SCENES.length) % SCENES.length;
    var to = (from + 1) % SCENES.length;
    var pos = cycleT - idx*total;
    var t = pos <= CFG.hold ? 0 : (pos - CFG.hold)/CFG.fade;
    return lerpScene(SCENES[from], SCENES[to], t*t*(3-2*t));
  }

  function setup(){
    dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    var rect = c.getBoundingClientRect();
    W = rect.width; H = rect.height;
    c.width = Math.floor(W*dpr);
    c.height = Math.floor(H*dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function ringPos(lat, ang, s, ring, out){
    var theta = lat*Math.PI;
    var hornR = Math.pow(Math.max(lat,0), s.hornPower), hornY = 1 - lat*2;
    var sphR = Math.sin(theta), sphY = Math.cos(theta);
    var r = hornR + (sphR-hornR)*s.shapeSphere;
    var y = hornY + (sphY-hornY)*s.shapeSphere;
    var px = Math.cos(ang)*r, py = y, pz = Math.sin(ang)*r;

    var st = Math.sin(theta), ct = Math.cos(theta);
    var snx = st*Math.cos(ang), sny = ct, snz = st*Math.sin(ang);
    var n2x = 0.894427, n2y = 0.447214;
    var cnx = Math.cos(ang)*n2x, cny = n2y, cnz = Math.sin(ang)*n2x;
    var nx = cnx + (snx-cnx)*s.shapeSphere;
    var ny = cny + (sny-cny)*s.shapeSphere;
    var nz = cnz + (snz-cnz)*s.shapeSphere;
    var nl = Math.sqrt(nx*nx+ny*ny+nz*nz) || 1;
    nx/=nl; ny/=nl; nz/=nl;

    var rs = ring.seed*47;
    var ox = Math.cos(rs)*50;
    var oy = Math.sin(rs*1.3)*50 + time*(0.6 + s.flow*1.6);
    var n = fbm(ox + Math.cos(ang)*s.noiseFreq, oy + Math.sin(ang)*s.noiseFreq, s.octaves) - 0.5;
    var k = n*2*s.noiseAmp*Math.pow(clamp01(lat), Math.max(s.ampFalloff,0));
    out[0] = px + nx*k; out[1] = py + ny*k; out[2] = pz + nz*k;
    return out;
  }

  var P = [0,0,0];

  function drawRing(ring, s, yaw){
    var lat = fract(time*ring.vel*(0.7 + s.flow*1.6) + ring.phase);
    var fin = Math.max(0.001, s.fadeIn), fout = Math.min(0.999, s.fadeOut);
    var op = Math.min(
      smoothstep(Math.max(0, fin-0.08), fin, lat),
      1 - smoothstep(fout, Math.min(1, fout+0.08), lat)
    ) * CFG.alpha;
    if (op <= 0.004) return;

    var pitch = s.cameraPitch*Math.PI/180;
    var cp = Math.cos(pitch), sp = Math.sin(pitch);
    var cyw = Math.cos(yaw), syw = Math.sin(yaw);
    var d = Math.max(1.5, s.cameraDist);
    var focal = (H*0.5)/Math.tan(CFG.fov*Math.PI/360)*CFG.framing;
    var ortho = s.projection === 'ortho';
    var scale = focal / (ortho ? d : 1);
    var cx = W*0.44, cy = H*0.5;
    var SEG = CFG.segments;

    ctx.strokeStyle = 'rgba(' + INK + ',' + op.toFixed(3) + ')';
    ctx.lineWidth = CFG.lineWidth;
    ctx.beginPath();
    for (var i=0;i<=SEG;i++){
      var ang = ring.ang + (i/SEG)*Math.PI*2;
      ringPos(lat, ang, s, ring, P);
      var x1 = P[0]*cyw + P[2]*syw;
      var z1 = -P[0]*syw + P[2]*cyw;
      var up = z1*cp + P[1]*sp;
      var dep = P[1]*cp - z1*sp;
      var denom = ortho ? 1 : Math.max(0.15, d - dep);
      var sx = cx + (x1 - s.targetX)*scale/denom;
      var sy = cy - (up - s.targetY)*scale/denom;
      if (i===0) ctx.moveTo(sx,sy); else ctx.lineTo(sx,sy);
    }
    ctx.closePath();
    ctx.stroke();
  }

  function render(dt){
    ctx.clearRect(0,0,W,H);
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    var s = currentScene();
    yawAcc += dt * s.spin * 0.4;
    var yaw = s.cameraYaw*Math.PI/180 + yawAcc;
    for (var i=0;i<rings.length;i++){
      rings[i].ang += rings[i].spin * s.spin * (dt || 0.016);
      drawRing(rings[i], s, yaw);
    }
  }

  /* 离屏暂停：Hero 滚出视口后停止渲染，避免白白占用主线程 */
  var onScreen = true;
  if (typeof IntersectionObserver === 'function' && c) {
    new IntersectionObserver(function (entries) {
      var was = onScreen;
      onScreen = entries[0].isIntersecting;
      if (onScreen && !was) lastFrame = performance.now();
    }, { threshold: 0 }).observe(c);
  }

  function tick(now){
    requestAnimationFrame(tick);
    if (!onScreen) return;
    var dt = Math.min(0.05, (now - lastFrame)/1000);
    lastFrame = now;
    if (!reduce){ time += dt; cycleT += dt; render(dt); }
  }

  setup();
  buildRings();
  if (reduce) render(0);
  requestAnimationFrame(tick);

  window.addEventListener('resize', function(){
    clearTimeout(resizeT);
    resizeT = setTimeout(function(){ setup(); if (reduce) render(0); }, 150);
  });
})();
</script>
